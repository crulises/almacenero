name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0  # misma versión que en desarrollo local
      - run: make up
      - run: make s3-alt-up  # S3 alternativo: los tests del almacén lo usan además del Storage local
      - run: make lint
      - run: make test
