# Backend y panel web de admin. Postgres/Auth/Storage los levanta el Supabase CLI (`make up`).
# Nombre fijo: sin esto Compose usa el nombre de la carpeta, y el checkout principal y cada
# worktree serían proyectos distintos peleando por los puertos 8000/8080. Con un solo
# proyecto, `make up` desde cualquier carpeta REEMPLAZA los contenedores en vez de chocar.
name: almacenero

services:
  backend:
    # Contexto = raíz del repo: la imagen incluye `etl/` (ETL livianos desde el panel, docs/04 §10-A).
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      # Desde el contenedor, el Postgres del CLI está en el host.
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
      # Almacén de exportaciones: el Storage de Supabase (o el S3 alternativo) también está en el host.
      EXPORT_S3_ENDPOINT: ${EXPORT_S3_ENDPOINT_DOCKER:-${EXPORT_S3_ENDPOINT:-}}
      AUTH_URL: http://host.docker.internal:54321/auth/v1
      JWKS_URL: http://host.docker.internal:54321/auth/v1/.well-known/jwks.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"

  # Panel web de admin: nginx con HTML + JS estático (admin-web/). Habla solo con el backend.
  admin-web:
    build: ./admin-web
    depends_on:
      - backend
    ports:
      - "8080:80"

  # S3 alternativo, OPCIONAL (perfil `s3-alt`: `make s3-alt-up`): SeaweedFS, un almacenamiento
  # S3-compatible libre. Sirve para probar que el almacén de exportaciones no está atado a Supabase
  # (docs/04 §11.4). No arranca con `make up`. API S3 en http://localhost:8333. (Se eligió SeaweedFS
  # porque MinIO dejó de publicar imágenes públicas; es solo para desarrollo y pruebas.)
  s3-alt:
    profiles: ["s3-alt"]
    image: chrislusf/seaweedfs:3.85
    command: server -s3 -dir=/data -ip.bind=0.0.0.0
    ports:
      - "8333:8333"
    volumes:
      - s3-alt-datos:/data

volumes:
  s3-alt-datos:
