# Solo el backend. Postgres/Auth/Storage los levanta el Supabase CLI (`make up`).
services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      # Desde el contenedor, el Postgres del CLI está en el host.
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
      JWKS_URL: http://host.docker.internal:54321/auth/v1/.well-known/jwks.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
