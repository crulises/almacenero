# Panel de admin (nginx estático) en Fly.io. Guía: docs/06-deploy.md.
app = "almacenero-web"          # nombre global en Fly: cambiarlo si está tomado
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  # El panel llama a esta URL (se escribe en /admin/config.js al arrancar el contenedor).
  API_URL = "https://almacenero-api.crulises.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
