# Panel de admin: solo archivos estáticos. Habla únicamente con el backend (/v1/admin),
# por CORS. Sin HTTPS acá: al desplegar va detrás del proxy/host que lo termine.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # Nada se cachea: el panel se actualiza con cada `make admin-web`.
    add_header Cache-Control "no-store" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
